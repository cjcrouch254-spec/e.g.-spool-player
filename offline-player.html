<style>
  :root{
    --bg:#14110F;
    --panel:#1B1713;
    --panel-2:#221D18;
    --line:#332C24;
    --amber:#E8A33D;
    --amber-dim:#8A6526;
    --teal:#4A9B8E;
    --text:#F2EDE4;
    --muted:#8A8177;
    --danger:#C4644A;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(232,163,61,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    min-height:100vh;
    overflow:hidden;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  ::selection{background:var(--amber); color:#14110F;}

  /* Scrollbars */
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  .app{
    display:flex;
    width:100%;
    height:100vh;
  }

  /* ===== LIBRARY (SIDEBAR) ===== */
  .library{
    width:320px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .lib-header{
    padding:22px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .lib-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:2px;
    color:var(--amber);
    text-transform:uppercase;
  }
  .lib-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
    margin-top:4px;
  }
  .lib-count{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }

  .add-zone{
    margin:14px 16px 8px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:14px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    font-size:13px;
    color:var(--muted);
  }
  .add-zone:hover, .add-zone.dragover{
    border-color:var(--amber);
    background:rgba(232,163,61,0.06);
    color:var(--text);
  }
  .add-zone b{color:var(--amber); font-weight:600;}

  .tracklist{
    flex:1;
    overflow-y:auto;
    padding:6px 8px 90px;
  }
  .banner{
    margin:0 16px 8px;
    padding:10px 12px;
    border-radius:8px;
    background:rgba(196,100,74,0.12);
    border:1px solid rgba(196,100,74,0.35);
    color:#E3A793;
    font-size:12px;
    line-height:1.5;
  }
  .empty-msg{
    padding:30px 20px;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
    text-align:center;
  }

  .track-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 10px;
    border-radius:8px;
    cursor:pointer;
    position:relative;
  }
  .track-row:hover{background:var(--panel-2);}
  .track-row.active{background:rgba(232,163,61,0.10);}
  .track-num{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    width:22px;
    flex-shrink:0;
    text-align:right;
  }
  .track-row.active .track-num{color:var(--amber);}
  .track-info{flex:1; min-width:0;}
  .track-name{
    font-size:13.5px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-row.active .track-name{color:var(--amber);}
  .track-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .track-del{
    opacity:0;
    background:none;
    border:none;
    color:var(--muted);
    font-size:15px;
    cursor:pointer;
    padding:4px 6px;
    flex-shrink:0;
  }
  .track-row:hover .track-del{opacity:1;}
  .track-del:hover{color:var(--danger);}
  .playing-icon{
    width:12px; flex-shrink:0;
    display:flex; align-items:flex-end; gap:1.5px; height:12px;
  }
  .playing-icon span{
    width:2.5px; background:var(--amber); border-radius:1px;
    animation: bounce 0.9s ease-in-out infinite;
  }
  .playing-icon span:nth-child(1){height:40%; animation-delay:-0.6s;}
  .playing-icon span:nth-child(2){height:100%; animation-delay:-0.3s;}
  .playing-icon span:nth-child(3){height:65%; animation-delay:0s;}
  @keyframes bounce{
    0%,100%{transform:scaleY(0.4);}
    50%{transform:scaleY(1);}
  }

  /* ===== DECK (MAIN) ===== */
  .deck{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px;
    position:relative;
    min-width:0;
  }
  .deck-readout{
    width:100%;
    max-width:560px;
    text-align:center;
  }
  .viz{
    width:100%;
    height:120px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4px;
    margin-bottom:28px;
  }
  .viz-bar{
    width:6px;
    background:linear-gradient(to top, var(--amber-dim), var(--amber));
    border-radius:3px 3px 0 0;
    height:4px;
    transition:height .06s linear;
  }
  .eyebrow-small{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:2px;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .track-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(24px,4vw,38px);
    font-weight:700;
    line-height:1.15;
    word-break:break-word;
  }
  .track-sub{
    color:var(--muted);
    font-size:13px;
    margin-top:8px;
    font-family:'JetBrains Mono',monospace;
  }

  .seek-row{
    width:100%;
    max-width:560px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:36px;
  }
  .time{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    width:44px;
    flex-shrink:0;
  }
  .time.end{text-align:right;}
  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    background:var(--line);
    border-radius:2px;
    outline:none;
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px;
    border-radius:50%;
    background:var(--amber);
    border:2px solid var(--bg);
    box-shadow:0 0 0 1px var(--amber);
    cursor:pointer;
    margin-top:-4.5px;
  }
  input[type=range]::-moz-range-thumb{
    width:13px; height:13px;
    border-radius:50%;
    background:var(--amber);
    border:2px solid var(--bg);
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px;}

  .transport{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-top:34px;
  }
  .tbtn{
    background:none;
    border:none;
    color:var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
    opacity:0.85;
    transition:opacity .15s, transform .1s;
  }
  .tbtn:hover{opacity:1;}
  .tbtn:active{transform:scale(0.92);}
  .tbtn.toggled{color:var(--amber); opacity:1;}
  .tbtn svg{width:20px; height:20px;}
  .play-btn{
    width:60px; height:60px;
    border-radius:50%;
    background:var(--amber);
    color:var(--bg);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 24px rgba(232,163,61,0.25);
  }
  .play-btn svg{width:22px; height:22px;}
  .play-btn:hover{opacity:1; background:#F0B25A;}

  .volume-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:40px;
    width:100%;
    max-width:220px;
  }
  .volume-row svg{width:16px; height:16px; color:var(--muted); flex-shrink:0;}

  .hint{
    position:absolute;
    bottom:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--line);
    letter-spacing:1px;
  }

  input[type=file]{display:none;}

  /* Mobile */
  @media (max-width:820px){
    .app{flex-direction:column;}
    .library{
      width:100%;
      height:42vh;
      border-right:none;
      border-bottom:1px solid var(--line);
    }
    .deck{padding:24px 20px; flex:1;}
    .transport{gap:18px;}
  }
  @media (prefers-reduced-motion: reduce){
    .playing-icon span{animation:none;}
    .viz-bar{transition:none;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="library">
    <div class="lib-header">
      <div class="lib-eyebrow">Spool</div>
      <div class="lib-title">Library</div>
      <div class="lib-count" id="libCount">0 tracks — stored on this device</div>
    </div>
    <div class="add-zone" id="addZone">
      <b>Choose files</b> or drop audio here<br>MP3, WAV, M4A, OGG
    </div>
    <div class="banner" id="banner" style="display:none;"></div>
    <input type="file" id="fileInput" multiple accept="audio/*,.mp3,.wav,.m4a,.ogg,.oga,.flac,.aac,.wma,.opus,audio/mpeg,audio/mp3">
    <div class="tracklist" id="tracklist">
      <div class="empty-msg" id="emptyMsg">Your library is empty.<br>Add songs above — they're saved on this device and play fully offline afterward.</div>
    </div>
  </aside>

  <main class="deck">
    <div class="deck-readout">
      <div class="viz" id="viz"></div>
      <div class="eyebrow-small" id="statusLine">No track loaded</div>
      <div class="track-title" id="trackTitle">Add a song to begin</div>
      <div class="track-sub" id="trackSub">&nbsp;</div>
    </div>

    <div class="seek-row">
      <span class="time" id="timeCur">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span class="time end" id="timeDur">0:00</span>
    </div>

    <div class="transport">
      <button class="tbtn" id="shuffleBtn" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
      </button>
      <button class="tbtn" id="prevBtn" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>
      </button>
      <button class="tbtn play-btn" id="playBtn" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
      </button>
      <button class="tbtn" id="nextBtn" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"></path></svg>
      </button>
      <button class="tbtn" id="repeatBtn" title="Repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"></path></svg>
      <input type="range" id="volume" min="0" max="100" value="80">
    </div>

    <div class="hint">SPACE PLAY/PAUSE · ←/→ SEEK · ↑/↓ VOLUME</div>
  </main>
</div>

<script>
(function(){
  "use strict";

  // ---------- IndexedDB ----------
  const DB_NAME = 'spool-player';
  const STORE = 'tracks';
  let db;

  let persistOK = true;
  let memId = 1;

  function openDB(){
    return new Promise((resolve, reject) => {
      if(!('indexedDB' in window)){
        reject(new Error('IndexedDB not available in this context'));
        return;
      }
      let req;
      try{
        req = indexedDB.open(DB_NAME, 1);
      }catch(err){
        reject(err);
        return;
      }
      req.onupgradeneeded = () => {
        const database = req.result;
        if(!database.objectStoreNames.contains(STORE)){
          database.createObjectStore(STORE, { keyPath:'id', autoIncrement:true });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('IndexedDB failed to open'));
      req.onblocked = () => reject(new Error('IndexedDB blocked'));
    });
  }

  function showBanner(msg){
    const b = el('banner');
    b.textContent = msg;
    b.style.display = 'block';
  }

  function addTrackToDB(track){
    if(!persistOK) return Promise.resolve(memId++);
    return new Promise((resolve, reject) => {
      try{
        const tx = db.transaction(STORE, 'readwrite');
        const req = tx.objectStore(STORE).add(track);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }catch(err){ reject(err); }
    });
  }

  function getAllTracks(){
    if(!persistOK) return Promise.resolve([]);
    return new Promise((resolve, reject) => {
      try{
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }catch(err){ reject(err); }
    });
  }

  function deleteTrackFromDB(id){
    if(!persistOK) return Promise.resolve();
    return new Promise((resolve, reject) => {
      try{
        const tx = db.transaction(STORE, 'readwrite');
        const req = tx.objectStore(STORE).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      }catch(err){ reject(err); }
    });
  }

  // ---------- State ----------
  let tracks = [];       // {id, name, type, blob}
  let currentIndex = -1;
  let isPlaying = false;
  let shuffleOn = false;
  let repeatMode = 0;    // 0=off, 1=all, 2=one
  let currentObjectURL = null;

  const audio = new Audio();
  audio.preload = 'metadata';

  // ---------- DOM ----------
  const el = id => document.getElementById(id);
  const tracklistEl = el('tracklist');
  const emptyMsg = el('emptyMsg');
  const libCount = el('libCount');
  const fileInput = el('fileInput');
  const addZone = el('addZone');
  const playBtn = el('playBtn');
  const playIcon = el('playIcon');
  const prevBtn = el('prevBtn');
  const nextBtn = el('nextBtn');
  const shuffleBtn = el('shuffleBtn');
  const repeatBtn = el('repeatBtn');
  const seek = el('seek');
  const timeCur = el('timeCur');
  const timeDur = el('timeDur');
  const trackTitle = el('trackTitle');
  const trackSub = el('trackSub');
  const statusLine = el('statusLine');
  const volume = el('volume');
  const vizEl = el('viz');

  audio.volume = 0.8;

  // ---------- Visualizer bars ----------
  const BAR_COUNT = 40;
  const bars = [];
  for(let i=0;i<BAR_COUNT;i++){
    const b = document.createElement('div');
    b.className = 'viz-bar';
    vizEl.appendChild(b);
    bars.push(b);
  }

  let vizRunning = false;
  function drawViz(){
    requestAnimationFrame(drawViz);
    const t = performance.now() / 1000;
    for(let i=0;i<BAR_COUNT;i++){
      let target;
      if(isPlaying){
        // Procedural "reactive-looking" motion — deliberately NOT wired
        // through the actual audio output, so it can never interfere
        // with playback (including background/locked-screen playback).
        const phase = i*0.7;
        const wobble = Math.sin(t*3 + phase) * 0.5 + Math.sin(t*5.3 + phase*1.7) * 0.3;
        target = 30 + (wobble+1)/2 * 80 + Math.sin(i*1.3)*10;
      } else {
        target = 4;
      }
      const cur = parseFloat(bars[i].style.height) || 4;
      bars[i].style.height = (cur + (target-cur)*0.25) + 'px';
    }
  }
  drawViz();

  // ---------- Helpers ----------
  function fmtTime(s){
    if(!isFinite(s)) return '0:00';
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function niceName(filename){
    return filename.replace(/\.[^/.]+$/, '');
  }

  function fmtSize(bytes){
    if(bytes > 1024*1024) return (bytes/(1024*1024)).toFixed(1)+' MB';
    return (bytes/1024).toFixed(0)+' KB';
  }

  // ---------- Rendering ----------
  function renderList(){
    tracklistEl.querySelectorAll('.track-row').forEach(n => n.remove());
    emptyMsg.style.display = tracks.length ? 'none' : 'block';
    libCount.textContent = `${tracks.length} track${tracks.length!==1?'s':''} — stored on this device`;

    tracks.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'track-row' + (i===currentIndex ? ' active' : '');
      row.innerHTML = `
        <span class="track-num">${i===currentIndex && isPlaying ? '' : (i+1)}</span>
        <div class="track-info">
          <div class="track-name">${escapeHtml(niceName(t.name))}</div>
          <div class="track-meta">${fmtSize(t.blob.size)}</div>
        </div>
        <button class="track-del" title="Remove">✕</button>
      `;
      if(i===currentIndex && isPlaying){
        const numSpan = row.querySelector('.track-num');
        numSpan.innerHTML = '<span class="playing-icon"><span></span><span></span><span></span></span>';
      }
      row.addEventListener('click', (e) => {
        if(e.target.closest('.track-del')) return;
        loadTrack(i, true);
      });
      row.querySelector('.track-del').addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = t.id;
        await deleteTrackFromDB(id);
        const wasCurrent = i === currentIndex;
        tracks.splice(i,1);
        if(wasCurrent){
          audio.pause();
          isPlaying = false;
          currentIndex = -1;
          updateNowPlaying();
        } else if(i < currentIndex){
          currentIndex--;
        }
        renderList();
      });
      tracklistEl.appendChild(row);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function updateNowPlaying(){
    if(currentIndex === -1){
      trackTitle.textContent = 'Add a song to begin';
      trackSub.innerHTML = '&nbsp;';
      statusLine.textContent = 'No track loaded';
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
      document.title = 'SPOOL — Offline Player';
      return;
    }
    const t = tracks[currentIndex];
    trackTitle.textContent = niceName(t.name);
    trackSub.textContent = `Track ${currentIndex+1} of ${tracks.length}`;
    statusLine.textContent = isPlaying ? 'Now Playing' : 'Paused';
    playIcon.innerHTML = isPlaying
      ? '<rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect>'
      : '<path d="M8 5v14l11-7z"></path>';
    document.title = (isPlaying ? '▶ ' : '') + niceName(t.name) + ' — SPOOL';

    if('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: niceName(t.name),
        artist: 'My Library',
        album: 'SPOOL'
      });
      navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
    }
  }

  // ---------- Playback ----------
  function loadTrack(index, autoplay){
    if(index < 0 || index >= tracks.length) return;
    currentIndex = index;
    const t = tracks[index];
    if(currentObjectURL) URL.revokeObjectURL(currentObjectURL);
    currentObjectURL = URL.createObjectURL(t.blob);
    audio.src = currentObjectURL;
    if(autoplay){
      audio.play().then(()=>{ isPlaying = true; renderList(); updateNowPlaying(); }).catch(()=>{});
    } else {
      isPlaying = false;
    }
    renderList();
    updateNowPlaying();
  }

  function togglePlay(){
    if(currentIndex === -1){
      if(tracks.length) loadTrack(0, true);
      return;
    }
    if(isPlaying){
      audio.pause();
      isPlaying = false;
    } else {
      audio.play().catch(()=>{});
      isPlaying = true;
    }
    renderList();
    updateNowPlaying();
  }

  function nextTrack(userInitiated){
    if(!tracks.length) return;
    let idx;
    if(shuffleOn){
      if(tracks.length === 1) idx = 0;
      else {
        do { idx = Math.floor(Math.random()*tracks.length); } while(idx === currentIndex);
      }
    } else {
      idx = currentIndex + 1;
      if(idx >= tracks.length){
        if(repeatMode === 1) idx = 0;
        else { isPlaying = false; renderList(); updateNowPlaying(); return; }
      }
    }
    loadTrack(idx, true);
  }

  function prevTrack(){
    if(!tracks.length) return;
    if(audio.currentTime > 3){ audio.currentTime = 0; return; }
    let idx = currentIndex - 1;
    if(idx < 0) idx = tracks.length - 1;
    loadTrack(idx, true);
  }

  audio.addEventListener('ended', () => {
    if(repeatMode === 2){ audio.currentTime = 0; audio.play(); return; }
    nextTrack(false);
  });

  audio.addEventListener('timeupdate', () => {
    if(!seek.dragging){
      const pct = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
      seek.value = pct;
    }
    timeCur.textContent = fmtTime(audio.currentTime);
    timeDur.textContent = fmtTime(audio.duration);
  });

  seek.addEventListener('input', () => {
    seek.dragging = true;
    if(audio.duration){
      timeCur.textContent = fmtTime((seek.value/100)*audio.duration);
    }
  });
  seek.addEventListener('change', () => {
    if(audio.duration){
      audio.currentTime = (seek.value/100)*audio.duration;
    }
    seek.dragging = false;
  });

  volume.addEventListener('input', () => {
    audio.volume = volume.value/100;
  });

  playBtn.addEventListener('click', togglePlay);
  nextBtn.addEventListener('click', () => nextTrack(true));
  prevBtn.addEventListener('click', prevTrack);
  shuffleBtn.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    shuffleBtn.classList.toggle('toggled', shuffleOn);
  });
  repeatBtn.addEventListener('click', () => {
    repeatMode = (repeatMode + 1) % 3;
    repeatBtn.classList.toggle('toggled', repeatMode !== 0);
    repeatBtn.style.color = repeatMode === 2 ? 'var(--teal)' : (repeatMode===1 ? 'var(--amber)' : '');
  });

  document.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    else if(e.code === 'ArrowRight'){ audio.currentTime = Math.min(audio.duration||0, audio.currentTime+5); }
    else if(e.code === 'ArrowLeft'){ audio.currentTime = Math.max(0, audio.currentTime-5); }
    else if(e.code === 'ArrowUp'){ e.preventDefault(); volume.value = Math.min(100, +volume.value+5); audio.volume = volume.value/100; }
    else if(e.code === 'ArrowDown'){ e.preventDefault(); volume.value = Math.max(0, +volume.value-5); audio.volume = volume.value/100; }
  });

  if('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', togglePlay);
    navigator.mediaSession.setActionHandler('pause', togglePlay);
    navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack(true));
  }

  // Safety net: if iOS ever pauses the <audio> element itself while
  // backgrounded (rare, but happens under memory pressure), resume
  // playback the moment the app is foregrounded again.
  function resumeAudioIfNeeded(){
    if(isPlaying && audio.paused){
      audio.play().catch(()=>{});
    }
  }
  document.addEventListener('visibilitychange', resumeAudioIfNeeded);
  window.addEventListener('focus', resumeAudioIfNeeded);
  window.addEventListener('pageshow', resumeAudioIfNeeded);

  // ---------- File adding ----------
  async function handleFiles(fileList){
    const files = Array.from(fileList).filter(f =>
      f.type.startsWith('audio/') || /\.(mp3|wav|m4a|ogg|flac|aac|wma)$/i.test(f.name)
    );
    if(files.length === 0 && fileList.length > 0){
      showBanner('Those files were not recognized as audio. Try MP3, WAV, M4A, OGG, or FLAC.');
      return;
    }
    for(const f of files){
      const track = { name: f.name, type: f.type, blob: f };
      try{
        const id = await addTrackToDB(track);
        tracks.push({ id, name: f.name, type: f.type, blob: f });
      }catch(err){
        // Storage failed (likely blocked in this browsing context) — still
        // keep the song playable for this session so it's never silently lost.
        persistOK = false;
        showBanner('Local storage is blocked in this browser/context, so songs will play but won\'t be saved for next time. Try opening this file in Chrome or Firefox instead of Safari, or serve it from a local folder rather than double-clicking it.');
        tracks.push({ id: memId++, name: f.name, type: f.type, blob: f });
      }
    }
    renderList();
  }

  addZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); fileInput.value=''; });

  ['dragover','dragenter'].forEach(ev => addZone.addEventListener(ev, (e) => {
    e.preventDefault(); addZone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(ev => addZone.addEventListener(ev, (e) => {
    e.preventDefault(); addZone.classList.remove('dragover');
  }));
  addZone.addEventListener('drop', (e) => {
    if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  // ---------- Init ----------
  (async function init(){
    try{
      db = await openDB();
      tracks = await getAllTracks();
    }catch(err){
      persistOK = false;
      showBanner('Local storage isn\'t available in this browsing context, so your library won\'t be saved between visits — but you can still add and play songs right now. Try opening this file in Chrome or Firefox for full offline saving.');
      tracks = [];
    }
    renderList();
    updateNowPlaying();
  })();

})();
</script>
</body>
</html>
